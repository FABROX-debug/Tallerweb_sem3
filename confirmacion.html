<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro enviado | Auditorio FISI</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <main class="tarjeta tarjeta-angosta">

    <div class="confirmacion">
      <p class="marca-exito" aria-hidden="true">&check;</p>

      <h1>Registro enviado</h1>

      <p class="confirmacion-texto">
        Tu asistencia quedó registrada. Recibirás la confirmación de tu cupo
        en el correo que indicaste.
      </p>

      <p class="confirmacion-texto">
        Preséntate en el Auditorio de la FISI quince minutos antes de tu sesión
        con tu DNI o carné universitario.
      </p>

      <a href="index.html" class="boton">Registrar otra asistencia</a>
    </div>

  </main>

</body>
